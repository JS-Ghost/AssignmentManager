version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: assignment_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: assignment_db
      MYSQL_USER: assignment_user
      MYSQL_PASSWORD: assignment_pass
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - assignment_mysql_data:/var/lib/mysql

volumes:
  assignment_mysql_data:
